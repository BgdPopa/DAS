{% extends "base.html" %}

{% block content %}
<div class="card p-4 mt-4">
    <h4>Ticket #{{ ticket.id }}: {{ ticket.title }}</h4>
    <hr>

    <p><strong>Descriere:</strong> {{ ticket.description }}</p>
    <p><strong>Severitate:</strong> {{ ticket.severity }}</p>
    <p><strong>Status:</strong> {{ ticket.status }}</p>

    <!-- [VULN] Afisarea owner_id ajuta la demonstrarea problemei IDOR in versiunea vulnerabila. -->
    <p><strong>Owner ID:</strong> {{ ticket.owner_id }}</p>

    <p><strong>Creat la:</strong> {{ ticket.created_at }}</p>

    <div class="mt-3">
        <!-- [VULN] In v1 nu verificam daca ticketul apartine utilizatorului curent inainte de editare. -->
        <a href="{{ url_for('tickets.edit', ticket_id=ticket.id) }}" class="btn btn-warning">Editeaza</a>
        <a href="{{ url_for('tickets.dashboard') }}" class="btn btn-secondary">Inapoi</a>
    </div>
</div>
{% endblock %}
