{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 mt-5">
            <h4 class="mb-3">Resetare parola</h4>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <!-- [VULN] In v1 token-ul de resetare este afisat direct in pagina, nu trimis securizat pe email. -->
                <button type="submit" class="btn btn-warning w-100">Trimite token</button>
            </form>

            <div class="mt-3 text-center">
                <a href="{{ url_for('auth.reset_password') }}">Am deja un token</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
