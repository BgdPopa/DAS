{% extends "base.html" %}

{% block content %}
<h4 class="mb-3">Rezultate pentru: "{{ query }}"</h4>

<!-- [VULN] Cautarea este vulnerabila in backend deoarece query-ul este concatenat direct in SQL. -->
<table class="table table-bordered bg-white">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Titlu</th>
            <th>Severitate</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody>
        {% for ticket in results %}
        <tr>
            <td>{{ ticket.id }}</td>
            <td>{{ ticket.title }}</td>
            <td>{{ ticket.severity }}</td>
            <td>{{ ticket.status }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="text-center">Niciun rezultat.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<a href="{{ url_for('tickets.dashboard') }}" class="btn btn-secondary">Inapoi</a>
{% endblock %}
