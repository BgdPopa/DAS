{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 mt-5">
            <h4 class="mb-3">Seteaza parola noua</h4>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Token</label>
                    <input type="text" name="token" class="form-control"
                           value="{{ token }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Parola noua</label>
                    <!-- [VULN] In v1 nu verificam complexitatea noii parole. -->
                    <input type="password" name="password" class="form-control" required>
                </div>

                <!-- [VULN] Token-ul poate fi reutilizat deoarece validarea este intentionat slaba in v1. -->
                <button type="submit" class="btn btn-primary w-100">Reseteaza parola</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
